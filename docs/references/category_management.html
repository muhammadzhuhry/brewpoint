<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#D9D5CD;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  @keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  ::placeholder{color:#9AA1AB;}
</style>
</helmet>

<div style="display:flex;width:1440px;height:900px;background:#fff;overflow:hidden;font-family:Inter,sans-serif;position:relative;">
  <dc-import name="Sidebar" active="categories" hint-size="240px,100%"></dc-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;background:#EFEFEF;">
    <header style="height:64px;flex:none;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
      <div style="display:flex;align-items:baseline;gap:12px;">
        <h2 style="margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:22px;color:#2B3A4A;">Categories</h2>
        <span style="font-size:13px;color:#9AA1AB;font-variant-numeric:tabular-nums;">{{ totalLabel }}</span>
      </div>
      <button onClick="{{ openAdd }}" style="height:40px;background:#2B3A4A;color:#fff;border:none;border-radius:10px;padding:0 16px;font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>New category
      </button>
    </header>

    <div style="flex:1;padding:24px;overflow:auto;min-height:0;">
      <div style="width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;">{{ listBody }}</div>
    </div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeModal }}" style="position:absolute;inset:0;background:rgba(31,41,51,.55);display:flex;align-items:center;justify-content:center;z-index:20;">
      <div onClick="{{ stop }}" style="width:420px;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(15,20,24,.3);animation:popIn .18s ease-out;">
        <div style="padding:22px 24px;border-bottom:1px solid #F1F0EC;display:flex;align-items:center;justify-content:space-between;">
          <h3 style="margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:19px;color:#2B3A4A;">{{ modalTitle }}</h3>
          <button onClick="{{ closeModal }}" style="width:32px;height:32px;border-radius:8px;border:none;background:#F3F3F1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div style="padding:24px;">
          <label style="display:block;font-size:12px;font-weight:600;color:#6B7280;margin-bottom:6px;">Category name <span style="color:#C0564D;">*</span></label>
          <input value="{{ form }}" onInput="{{ onField }}" placeholder="e.g. Seasonal Drinks" style="{{ inputStyle }}" />
          <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><span style="display:block;margin-top:6px;font-size:12px;color:#A6413A;">{{ err }}</span></sc-if>
        </div>
        <div style="padding:18px 24px;border-top:1px solid #F1F0EC;display:flex;justify-content:flex-end;gap:12px;">
          <button onClick="{{ closeModal }}" style="height:42px;background:transparent;color:#2B3A4A;border:1px solid #C7CCD1;border-radius:10px;padding:0 20px;font:500 14px Inter,sans-serif;cursor:pointer;">Cancel</button>
          <button onClick="{{ saveCat }}" style="height:42px;background:#2B3A4A;color:#fff;border:none;border-radius:10px;padding:0 20px;font:600 14px Inter,sans-serif;cursor:pointer;">{{ saveLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- DELETE CONFIRM / BLOCKED -->
  <sc-if value="{{ confirmOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ cancelDelete }}" style="position:absolute;inset:0;background:rgba(31,41,51,.55);display:flex;align-items:center;justify-content:center;z-index:30;">
      <div onClick="{{ stop }}" style="width:440px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 16px 48px rgba(15,20,24,.3);display:flex;flex-direction:column;gap:16px;animation:popIn .18s ease-out;">
        <div style="width:46px;height:46px;border-radius:11px;background:{{ confirmIconBg }};display:flex;align-items:center;justify-content:center;">{{ confirmIcon }}</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <h3 style="margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:#2B3A4A;">{{ confirmTitle }}</h3>
          <p style="margin:0;font-size:13.5px;line-height:1.55;color:#6B7280;">{{ confirmMessage }}</p>
        </div>
        <sc-if value="{{ blocked }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:flex-start;gap:9px;padding:11px 13px;background:#FBF0DD;border:1px solid #F0DFBD;border-radius:10px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A5E17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="m9 11 3 3L22 4"/></svg>
            <span style="font-size:12.5px;line-height:1.5;color:#8A5E17;">Reassign these products to another category first, then delete this one.</span>
          </div>
        </sc-if>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:2px;">{{ confirmActions }}</div>
      </div>
    </div>
  </sc-if>

  <!-- DETAIL DRAWER -->
  <sc-if value="{{ detailOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeDetail }}" style="position:absolute;inset:0;background:rgba(31,41,51,.45);display:flex;justify-content:flex-end;z-index:25;">
      <div onClick="{{ stop }}" style="width:440px;height:100%;background:#fff;box-shadow:-8px 0 32px rgba(15,20,24,.2);display:flex;flex-direction:column;">
        <div style="padding:20px 24px;border-bottom:1px solid #F1F0EC;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-family:Poppins,sans-serif;font-weight:600;font-size:15px;color:#6B7280;">Category detail</span>
          <button onClick="{{ closeDetail }}" style="width:32px;height:32px;border-radius:8px;border:none;background:#F3F3F1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div style="flex:1;overflow:auto;padding:24px;">{{ detailBody }}</div>
        <div style="padding:16px 24px;border-top:1px solid #F1F0EC;display:flex;gap:10px;">
          <button onClick="{{ editFromDetail }}" style="flex:1;height:42px;background:#2B3A4A;color:#fff;border:none;border-radius:10px;font:600 14px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Rename
          </button>
          <button onClick="{{ deleteFromDetail }}" style="height:42px;background:#F6E1DE;color:#A6413A;border:none;border-radius:10px;padding:0 16px;font:600 14px Inter,sans-serif;cursor:pointer;">Delete</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = {
    modal: null,     // {mode, id}
    form: '',
    err: '',
    confirm: null,   // category id
    detail: null,    // category id
    categories: [
      { id: 1, name: 'Espresso', icon: 'cup' },
      { id: 2, name: 'Brewed Coffee', icon: 'brew' },
      { id: 3, name: 'Non-Coffee', icon: 'leaf' },
      { id: 4, name: 'Pastry', icon: 'croissant' },
      { id: 5, name: 'Retail Beans', icon: 'box' },
      { id: 6, name: 'Seasonal Drinks', icon: 'snow' },
      { id: 7, name: 'Merchandise', icon: 'box' },
    ],
    // product catalog -> counts per category
    products: [
      ['Espresso', ['Cappuccino', 'Caffè Latte', 'Flat White', 'Americano', 'Cortado', 'Espresso', 'Macchiato', 'Mocha']],
      ['Brewed Coffee', ['Cold Brew', 'Nitro Cold Brew', 'Pour Over', 'Drip Coffee']],
      ['Non-Coffee', ['Matcha Latte', 'Chai Latte', 'Hot Chocolate', 'London Fog', 'Steamer']],
      ['Pastry', ['Butter Croissant', 'Almond Croissant', 'Blueberry Muffin', 'Cinnamon Roll', 'Chocolate Cookie', 'Banana Bread']],
      ['Retail Beans', ['House Blend 12oz', 'Ethiopia 12oz', 'Decaf 12oz']],
      ['Seasonal Drinks', []],
      ['Merchandise', []],
    ],
    nextId: 8,
  };

  ICONS = {
    cup: '<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="1" y2="4"/><line x1="10" x2="10" y1="1" y2="4"/><line x1="14" x2="14" y1="1" y2="4"/>',
    brew: '<path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8Z"/><path d="M5 8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3"/><path d="M12 5V2"/>',
    leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
    croissant: '<path d="M4.6 13.11l5.79-3.21c1.89-1.05 4.79 1.78 3.71 3.71l-3.22 5.81C8.8 23.16.79 15.23 4.6 13.11Z"/><path d="M10.5 9.5C11 5 15.5 2 20 2c0 4.5-3 9-7.5 9.5"/>',
    box: '<path d="M7.5 4.27 16.5 9.4"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
    snow: '<path d="m2 12 10 0M12 2v20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/>',
  };

  count(name) { const row = this.state.products.find(p => p[0] === name); return row ? row[1].length : 0; }
  productsOf(name) { const row = this.state.products.find(p => p[0] === name); return row ? row[1] : []; }

  openAdd = () => this.setState({ modal: { mode: 'add' }, form: '', err: '' });
  openEdit = (c) => this.setState({ modal: { mode: 'edit', id: c.id }, form: c.name, err: '', detail: null });
  closeModal = () => this.setState({ modal: null, err: '' });
  onField = (e) => this.setState({ form: e.target.value });
  stop = (e) => e.stopPropagation();

  saveCat = () => {
    const name = this.state.form.trim();
    if (!name) { this.setState({ err: 'Category name is required.' }); return; }
    const dup = this.state.categories.find(c => c.name.toLowerCase() === name.toLowerCase() && (!this.state.modal.id || c.id !== this.state.modal.id));
    if (dup) { this.setState({ err: 'A category with this name already exists.' }); return; }
    if (this.state.modal.mode === 'add') {
      this.setState({ categories: [...this.state.categories, { id: this.state.nextId, name, icon: 'cup' }], products: [...this.state.products, [name, []]], nextId: this.state.nextId + 1, modal: null, err: '' });
    } else {
      const id = this.state.modal.id; const old = this.state.categories.find(c => c.id === id).name;
      this.setState({
        categories: this.state.categories.map(c => c.id === id ? { ...c, name } : c),
        products: this.state.products.map(p => p[0] === old ? [name, p[1]] : p),
        modal: null, err: '',
      });
    }
  };

  askDelete = (c) => this.setState({ confirm: c.id, detail: null });
  cancelDelete = () => this.setState({ confirm: null });
  doDelete = () => {
    const c = this.state.categories.find(x => x.id === this.state.confirm);
    if (!c || this.count(c.name) > 0) return; // blocked
    this.setState({ categories: this.state.categories.filter(x => x.id !== this.state.confirm), products: this.state.products.filter(p => p[0] !== c.name), confirm: null });
  };
  openDetail = (c) => this.setState({ detail: c.id });
  closeDetail = () => this.setState({ detail: null });
  editFromDetail = () => { const c = this.state.categories.find(x => x.id === this.state.detail); if (c) this.openEdit(c); };
  deleteFromDetail = () => { const c = this.state.categories.find(x => x.id === this.state.detail); if (c) this.askDelete(c); };

  renderVals() {
    const h = React.createElement;
    const cats = this.state.categories;
    const total = cats.length;
    const totalLabel = total === 1 ? '1 category' : total + ' categories';

    // ---- LIST ----
    const iconEl = (name, size, stroke) => h('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: stroke || '#2B3A4A', strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: this.ICONS[name] || this.ICONS.cup } });

    let listBody;
    if (total === 0) {
      listBody = h('div', { style: { flex: 1, minHeight: '440px', background: '#fff', border: '1px solid #E5E7EB', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px' } },
        h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '14px', textAlign: 'center' } },
          h('div', { style: { width: '64px', height: '64px', borderRadius: '9999px', background: '#F3ECDD', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, iconEl('leaf', 28, '#B08D57')),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '5px' } },
            h('span', { style: { fontFamily: 'Poppins,sans-serif', fontWeight: 600, fontSize: '18px', color: '#2B3A4A' } }, 'No categories yet'),
            h('span', { style: { fontSize: '13.5px', color: '#6B7280', maxWidth: '320px', lineHeight: 1.5 } }, 'Create your first category to start organizing the menu — products get assigned to one.')),
          h('button', { onClick: this.openAdd, style: { height: '40px', background: '#2B3A4A', color: '#fff', border: 'none', borderRadius: '10px', padding: '0 16px', fontFamily: 'Inter,sans-serif', fontWeight: 600, fontSize: '14px', display: 'inline-flex', alignItems: 'center', gap: '8px', cursor: 'pointer' } },
            h('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: '#fff', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: '<path d="M5 12h14M12 5v14"/>' } }), 'Create your first category')));
    } else {
      const iconBtn = (inner, color, onClick, title) => h('button', { onClick: (e) => { e.stopPropagation(); onClick(); }, title, style: { width: '30px', height: '30px', borderRadius: '8px', border: 'none', background: 'transparent', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }, onMouseEnter: (e) => e.currentTarget.style.background = '#F3F3F1', onMouseLeave: (e) => e.currentTarget.style.background = 'transparent' }, h('svg', { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: inner } }));
      const cards = cats.map((c) => {
        const n = this.count(c.name); const empty = n === 0;
        const items = this.productsOf(c.name);
        const sample = empty ? 'No products assigned yet' : items.slice(0, 4).join(' · ') + (items.length > 4 ? ' · +' + (items.length - 4) + ' more' : '');
        return h('div', { key: c.id, onClick: () => this.openDetail(c), style: { background: '#fff', border: '1px solid #E5E7EB', borderRadius: '12px', padding: '18px', display: 'flex', flexDirection: 'column', gap: '14px', cursor: 'pointer' }, onMouseEnter: (e) => e.currentTarget.style.borderColor = '#C7CCD1', onMouseLeave: (e) => e.currentTarget.style.borderColor = '#E5E7EB' },
          h('div', { style: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' } },
            h('div', { style: { width: '44px', height: '44px', borderRadius: '11px', background: '#F3ECDD', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, iconEl(c.icon, 20)),
            h('div', { style: { display: 'flex', gap: '2px' }, onClick: (e) => e.stopPropagation() },
              iconBtn('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>', '#6B7280', () => this.openEdit(c), 'Rename'),
              iconBtn('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', '#C0564D', () => this.askDelete(c), 'Delete'))),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '3px' } },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
              h('span', { style: { fontFamily: 'Poppins,sans-serif', fontWeight: 600, fontSize: '16px', color: '#2B3A4A' } }, c.name),
              empty ? h('span', { style: { padding: '2px 9px', borderRadius: '9999px', fontSize: '11px', fontWeight: 600, background: '#EFEFEF', color: '#9AA1AB' } }, 'Empty') : null),
            h('span', { style: { fontSize: '12.5px', color: empty ? '#9AA1AB' : '#6B7280', fontVariantNumeric: 'tabular-nums' } }, empty ? 'No products' : (n + (n === 1 ? ' product' : ' products')))),
          h('span', { style: { fontSize: '12.5px', color: '#9AA1AB', lineHeight: 1.5, minHeight: '38px' } }, sample));
      });
      listBody = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', alignContent: 'start' } }, cards);
    }

    // ---- modal ----
    const md = this.state.modal;
    const modalOpen = !!md;
    const err = this.state.err;
    const inputStyle = 'width:100%;box-sizing:border-box;height:42px;padding:0 12px;border-radius:10px;font:400 14px Inter,sans-serif;color:#1F2933;background:#fff;outline:none;' + (err ? 'border:1px solid #C0564D;box-shadow:0 0 0 3px rgba(192,86,77,.12);' : 'border:1px solid #E5E7EB;');

    // ---- confirm / blocked ----
    const cc = this.state.confirm ? cats.find(c => c.id === this.state.confirm) : null;
    const confirmOpen = !!cc;
    const cnt = cc ? this.count(cc.name) : 0;
    const blocked = cnt > 0;
    let confirmActions = null, confirmIcon = null;
    if (cc) {
      const cancelBtn = h('button', { key: 'c', onClick: this.cancelDelete, style: { height: '40px', background: blocked ? '#2B3A4A' : 'transparent', color: blocked ? '#fff' : '#2B3A4A', border: blocked ? 'none' : '1px solid #C7CCD1', borderRadius: '10px', padding: '0 16px', fontFamily: 'Inter,sans-serif', fontWeight: blocked ? 600 : 500, fontSize: '14px', cursor: 'pointer' } }, blocked ? 'Got it' : 'Cancel');
      confirmActions = blocked ? [cancelBtn] : [cancelBtn, h('button', { key: 'd', onClick: this.doDelete, style: { height: '40px', background: '#C0564D', color: '#fff', border: 'none', borderRadius: '10px', padding: '0 16px', fontFamily: 'Inter,sans-serif', fontWeight: 600, fontSize: '14px', cursor: 'pointer' } }, 'Delete category')];
      const ic = blocked ? '<path d="M18 6 6 18M6 6l12 12"/>' : '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>';
      confirmIcon = h('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: '#C0564D', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: ic } });
    }

    // ---- detail ----
    const dc = this.state.detail ? cats.find(c => c.id === this.state.detail) : null;
    const detailOpen = !!dc;
    let detailBody = null;
    if (dc) {
      const items = this.productsOf(dc.name);
      detailBody = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '20px' } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '14px' } },
          h('div', { style: { width: '56px', height: '56px', borderRadius: '13px', background: '#F3ECDD', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' } }, iconEl(dc.icon, 26)),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '3px' } },
            h('span', { style: { fontFamily: 'Poppins,sans-serif', fontWeight: 600, fontSize: '20px', color: '#2B3A4A' } }, dc.name),
            h('span', { style: { fontSize: '13px', color: '#6B7280', fontVariantNumeric: 'tabular-nums' } }, items.length === 0 ? 'No products assigned' : items.length + (items.length === 1 ? ' product' : ' products')))),
        h('div', { style: { display: 'flex', flexDirection: 'column' } },
          h('span', { style: { fontSize: '11.5px', fontWeight: 600, letterSpacing: '.04em', color: '#9AA1AB', marginBottom: '4px' } }, 'PRODUCTS IN THIS CATEGORY'),
          items.length === 0
            ? h('div', { style: { padding: '28px', textAlign: 'center', border: '1px dashed #DDD9D1', borderRadius: '10px', color: '#9AA1AB', fontSize: '13px', marginTop: '8px' } }, 'No products are assigned to this category yet.')
            : h('div', { style: { display: 'flex', flexDirection: 'column' } }, items.map((name, i) => h('div', { key: name, style: { display: 'flex', alignItems: 'center', gap: '12px', height: '52px', borderBottom: i < items.length - 1 ? '1px solid #F1F0EC' : 'none' } },
                h('div', { style: { width: '32px', height: '32px', borderRadius: '8px', background: '#F3ECDD', color: '#2B3A4A', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '13px', fontFamily: 'Poppins,sans-serif', flex: 'none' } }, name[0]),
                h('span', { style: { fontSize: '14px', color: '#374151', fontWeight: 500 } }, name))))));
    }

    return {
      totalLabel, listBody, openAdd: this.openAdd,
      modalOpen, modalTitle: md && md.mode === 'edit' ? 'Rename category' : 'New category', saveLabel: md && md.mode === 'edit' ? 'Save changes' : 'Create category',
      form: this.state.form, onField: this.onField, err, inputStyle, closeModal: this.closeModal, saveCat: this.saveCat, stop: this.stop,
      confirmOpen, blocked, confirmIcon, confirmIconBg: blocked ? '#FBF0DD' : '#F6E1DE', confirmActions,
      confirmTitle: cc ? (blocked ? 'Can\u2019t delete \u201C' + cc.name + '\u201D' : 'Delete \u201C' + cc.name + '\u201D?') : '',
      confirmMessage: cc ? (blocked
        ? 'This category still has ' + cnt + (cnt === 1 ? ' product' : ' products') + ' assigned to it. Categories with products can\u2019t be deleted.'
        : 'This category has no products assigned, so it can be safely removed. This can\u2019t be undone.') : '',
      cancelDelete: this.cancelDelete, doDelete: this.doDelete,
      detailOpen, detailBody, closeDetail: this.closeDetail, editFromDetail: this.editFromDetail, deleteFromDetail: this.deleteFromDetail,
    };
  }
}
</script>
