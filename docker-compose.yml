services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewpoint
      POSTGRES_PASSWORD: 123456990
      POSTGRES_DB: brewpoint_db
    ports:
      - "5432:5432"
    volumes:
      - brewpoint_data:/var/lib/postgresql/data

volumes:
  brewpoint_data:
